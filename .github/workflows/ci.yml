name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vscode-violet
        uses: actions/checkout@v4
        with:
          path: vscode-violet

      - name: Checkout tree-sitter-violet
        uses: actions/checkout@v4
        with:
          repository: violet-prover/tree-sitter-violet
          path: tree-sitter-violet

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-violet/package-lock.json

      - name: Install vscode-violet deps
        working-directory: vscode-violet
        run: npm ci

      - name: Install tree-sitter-violet deps
        working-directory: tree-sitter-violet
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build (compile + wasm)
        working-directory: vscode-violet
        run: npm run prepackage

      - name: Grammar tests
        working-directory: vscode-violet
        run: npm run test:grammar

      - name: Extension tests
        working-directory: vscode-violet
        run: xvfb-run -a npm test
