name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout vscode-violet
        uses: actions/checkout@v4
        with:
          path: vscode-violet

      - name: Checkout tree-sitter-violet
        uses: actions/checkout@v4
        with:
          repository: violet-prover/tree-sitter-violet
          path: tree-sitter-violet

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-violet/package-lock.json

      - name: Install vscode-violet deps
        working-directory: vscode-violet
        run: npm ci

      - name: Install tree-sitter-violet deps
        working-directory: tree-sitter-violet
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Package .vsix
        working-directory: vscode-violet
        run: npm run package

      - name: Upload .vsix to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-violet/*.vsix
