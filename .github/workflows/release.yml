name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Set these as repository secrets to enable publishing. If a secret is
      # missing the corresponding publish step is skipped, so packaging +
      # GitHub Release still work without any marketplace credentials.
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - name: Checkout vscode-violet
        uses: actions/checkout@v4
        with:
          path: vscode-violet

      - name: Checkout tree-sitter-violet
        uses: actions/checkout@v4
        with:
          repository: violet-prover/tree-sitter-violet
          path: tree-sitter-violet

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: vscode-violet/package-lock.json

      - name: Install vscode-violet deps
        working-directory: vscode-violet
        run: npm ci

      - name: Install tree-sitter-violet deps
        working-directory: tree-sitter-violet
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Verify tag matches package.json version
        working-directory: vscode-violet
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi

      - name: Package .vsix
        working-directory: vscode-violet
        run: npm run package

      - name: Upload .vsix to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: vscode-violet/*.vsix

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        working-directory: vscode-violet
        run: npx --yes @vscode/vsce publish --packagePath *.vsix

      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        working-directory: vscode-violet
        run: npx --yes ovsx publish *.vsix -p "$OVSX_PAT"
